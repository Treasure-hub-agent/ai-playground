<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="qr-title qr-desc">
  <title id="qr-title">打赏二维码占位图</title>
  <desc id="qr-desc">手绘风格的打赏二维码占位图，标注“打赏二维码占位 · 发布前替换”，不含真实收款信息。</desc>

  <defs>
    <pattern id="qr-modules" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="10" height="10" rx="1.2" fill="#22312f"/>
    </pattern>
    <pattern id="paper-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#22312f" opacity="0.16"/>
    </pattern>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="9" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="600" height="760" fill="#f7f0df" />
  <rect width="600" height="760" fill="url(#paper-dots)" />

  <!-- 背景涂鸦 -->
  <g fill="none" stroke="#22312f" stroke-linecap="round" opacity="0.35">
    <path d="M42 210 q14 -18 28 0 q-14 18 -28 0z" stroke-width="2.5" />
    <path d="M510 118 q10 -14 21 0 q-11 14 -21 0z" stroke-width="2" />
    <path d="M76 662 q16 -22 32 0" stroke-width="2" stroke-dasharray="5 7" />
    <path d="M492 652 l8 8 m0 -8 l-8 8" stroke-width="2.5" />
    <circle cx="540" cy="330" r="8" stroke-width="2" opacity="0.5" />
    <circle cx="540" cy="330" r="2.5" fill="#22312f" stroke="none" opacity="0.5" />
  </g>

  <g transform="rotate(-1.4 300 372)">
    <!-- 卡片阴影与纸面 -->
    <rect x="56" y="54" width="492" height="648" rx="34" fill="#cbbfa7" opacity="0.65" />
    <rect x="48" y="44" width="492" height="648" rx="34" fill="#fffaf0" stroke="#22312f" stroke-width="5" filter="url(#rough)" />
    <rect x="72" y="68" width="444" height="600" rx="22" fill="none" stroke="#22312f" stroke-width="2" stroke-dasharray="10 9" opacity="0.42" />

    <!-- 标题 -->
    <text x="294" y="122" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" letter-spacing="5" fill="#68786f">SUPPORT · AI PLAYGROUND</text>
    <text x="294" y="171" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#22312f">打赏二维码占位</text>
    <path d="M190 189 q52 10 104 0 t104 0" fill="none" stroke="#e9b949" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- 二维码外框 -->
    <rect x="126" y="218" width="348" height="348" rx="18" fill="#ffffff" stroke="#22312f" stroke-width="4" />
    <rect x="139" y="231" width="322" height="322" rx="10" fill="none" stroke="#22312f" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />

    <!-- 装饰性二维码模块 -->
    <rect x="147" y="239" width="306" height="306" fill="url(#qr-modules)" />

    <!-- 三个定位角（白底 + 黑框 + 白芯 + 黑点） -->
    <g>
      <rect x="141" y="233" width="84" height="84" fill="#ffffff" />
      <rect x="147" y="239" width="78" height="78" rx="9" fill="#22312f" />
      <rect x="159" y="251" width="54" height="54" rx="6" fill="#ffffff" />
      <rect x="171" y="263" width="30" height="30" rx="4" fill="#22312f" />
    </g>
    <g>
      <rect x="375" y="233" width="84" height="84" fill="#ffffff" />
      <rect x="381" y="239" width="78" height="78" rx="9" fill="#22312f" />
      <rect x="393" y="251" width="54" height="54" rx="6" fill="#ffffff" />
      <rect x="405" y="263" width="30" height="30" rx="4" fill="#22312f" />
    </g>
    <g>
      <rect x="141" y="461" width="84" height="84" fill="#ffffff" />
      <rect x="147" y="467" width="78" height="78" rx="9" fill="#22312f" />
      <rect x="159" y="479" width="54" height="54" rx="6" fill="#ffffff" />
      <rect x="171" y="491" width="30" height="30" rx="4" fill="#22312f" />
    </g>

    <!-- 打散几个模块，制造手绘占位的随机感 -->
    <g fill="#ffffff">
      <rect x="243" y="257" width="18" height="18" rx="2" />
      <rect x="297" y="275" width="18" height="18" rx="2" />
      <rect x="333" y="257" width="18" height="18" rx="2" />
      <rect x="261" y="311" width="18" height="18" rx="2" />
      <rect x="315" y="329" width="18" height="18" rx="2" />
      <rect x="351" y="293" width="18" height="18" rx="2" />
      <rect x="243" y="365" width="18" height="18" rx="2" />
      <rect x="297" y="383" width="18" height="18" rx="2" />
      <rect x="333" y="401" width="18" height="18" rx="2" />
      <rect x="261" y="437" width="18" height="18" rx="2" />
      <rect x="315" y="455" width="18" height="18" rx="2" />
      <rect x="369" y="419" width="18" height="18" rx="2" />
      <rect x="405" y="365" width="18" height="18" rx="2" />
      <rect x="243" y="491" width="18" height="18" rx="2" />
      <rect x="387" y="491" width="18" height="18" rx="2" />
    </g>

    <!-- 占位印章 -->
    <g transform="rotate(8 468 206)">
      <rect x="430" y="188" width="76" height="36" rx="7" fill="#d95f43" />
      <text x="468" y="213" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fffaf0">占位</text>
    </g>

    <!-- 说明文字 -->
    <text x="300" y="608" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#c94f3d">打赏二维码占位 · 发布前替换</text>
    <text x="300" y="642" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#4b5b52">微信 / 支付宝收款码放这里</text>
    <text x="300" y="667" text-anchor="middle" font-family="ui-monospace,Consolas,'Cascadia Mono',monospace" font-size="13" fill="#68786f">assets/support-qr-placeholder.svg</text>

    <!-- 手绘箭头 -->
    <g fill="none" stroke="#d95f43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M443 641 q26 18 44 3" />
      <path d="M480 634 l8 10 l-13 3" />
    </g>
  </g>

  <!-- 卡片外页脚 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <path d="M210 726 q10 -34 38 -34 q28 0 38 34 z" fill="#e9b949" stroke="#22312f" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M204 726 h88" fill="none" stroke="#22312f" stroke-width="3" stroke-linecap="round" />
    <path d="M250 690 q-6 -12 3 -22 m12 22 q-6 -12 3 -22" fill="none" stroke="#22312f" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <text x="306" y="733" font-size="15" fill="#4b5b52">谢谢你来玩 · 祝你今天也有好运气</text>
    <text x="300" y="750" text-anchor="middle" font-size="10" letter-spacing="3" fill="#8a978f">AI PLAYGROUND · 2026</text>
  </g>
</svg>
