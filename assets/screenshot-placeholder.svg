      <rect x="100" y="492" width="100" height="100" rx="16" fill="#fbf3e4" stroke="#22312f" stroke-width="2.2" stroke-dasharray="6 7" />
      <text x="150" y="550" text-anchor="middle" class="ui" font-size="17" fill="#9aa79e">空</text>
    </g>
    <g>
      <rect x="212" y="492" width="100" height="100" rx="16" fill="#fff7e8" stroke="#22312f" stroke-width="2.5" />
      <circle cx="262" cy="532" r="28" fill="#e9b949" stroke="#22312f" stroke-width="2.5" />
      <circle cx="262" cy="532" r="20" fill="#f6d57e" stroke="#22312f" stroke-width="1.5" opacity="0.8" />
      <text x="262" y="541" text-anchor="middle" class="ui" font-size="22" font-weight="800" fill="#22312f">1</text>
      <text x="262" y="578" text-anchor="middle" class="ui" font-size="11" fill="#68786f">金币 +1</text>
    </g>
    <g>
      <rect x="324" y="492" width="100" height="100" rx="16" fill="#fff7e8" stroke="#22312f" stroke-width="2.5" />
      <circle cx="374" cy="532" r="28" fill="#e9b949" stroke="#22312f" stroke-width="2.5" />
      <circle cx="374" cy="532" r="20" fill="#f6d57e" stroke="#22312f" stroke-width="1.5" opacity="0.8" />
      <text x="374" y="541" text-anchor="middle" class="ui" font-size="22" font-weight="800" fill="#22312f">2</text>
      <text x="374" y="578" text-anchor="middle" class="ui" font-size="11" fill="#68786f">金币 +2</text>
    </g>
