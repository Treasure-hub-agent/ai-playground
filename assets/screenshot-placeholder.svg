      <circle cx="374" cy="420" r="20" fill="#f6d57e" stroke="#22312f" stroke-width="1.5" opacity="0.8" />
      <text x="374" y="429" text-anchor="middle" class="ui" font-size="22" font-weight="800" fill="#22312f">3</text>
      <text x="374" y="466" text-anchor="middle" class="ui" font-size="11" fill="#68786f">金币 +3</text>
    </g>

    <!-- 行 2 -->
