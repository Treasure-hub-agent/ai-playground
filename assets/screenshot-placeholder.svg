<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="shot-title shot-desc">
  <title id="shot-title">对局截图占位图</title>
  <desc id="shot-desc">手绘风格的《抢宝大作战》对局截图占位，标注“对局截图占位 · 发布前替换”。</desc>

  <defs>
    <pattern id="shot-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.7" fill="#22312f" opacity="0.14" />
    </pattern>
    <filter id="shot-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="14" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <style>
      .ui { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .mono { font-family: ui-monospace, Consolas, 'Cascadia Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#f7f0df" />
  <rect width="1200" height="675" fill="url(#shot-dots)" />

  <!-- 背景涂鸦 -->
  <g fill="none" stroke="#22312f" stroke-linecap="round" opacity="0.3">
    <path d="M28 120 q16 -20 32 0 q-16 20 -32 0z" stroke-width="2.5" />
    <path d="M1132 420 q18 -22 36 0" stroke-width="2.5" stroke-dasharray="5 7" />
    <path d="M1140 470 l10 10 m0 -10 l-10 10" stroke-width="2.5" />
    <circle cx="80" cy="560" r="9" stroke-width="2" />
  </g>

  <!-- 浏览器窗口 -->
  <rect x="54" y="46" width="1104" height="576" rx="26" fill="#cbbfa7" opacity="0.6" />
  <rect x="48" y="40" width="1104" height="576" rx="26" fill="#fffaf0" stroke="#22312f" stroke-width="5" filter="url(#shot-rough)" />

  <!-- 窗口顶栏 -->
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#22312f" stroke-width="2.5" opacity="0.55" />
  <g fill="#d95f43" stroke="#22312f" stroke-width="2">
    <circle cx="84" cy="70" r="7" />
  </g>
  <g fill="#e9b949" stroke="#22312f" stroke-width="2">
    <circle cx="110" cy="70" r="7" />
  </g>
  <g fill="#8fb6a0" stroke="#22312f" stroke-width="2">
    <circle cx="136" cy="70" r="7" />
  </g>
  <rect x="166" y="54" width="660" height="32" rx="16" fill="#f2ead9" stroke="#22312f" stroke-width="1.8" />
  <text x="184" y="75" class="mono" font-size="13" fill="#4b5b52">127.0.0.1:5173/?room=demo&amp;seat=0</text>
  <text x="1122" y="75" text-anchor="end" class="ui" font-size="13" fill="#68786f">M0 · 占位</text>

  <!-- 左侧：游戏标题与比分 -->
  <text x="100" y="152" class="ui" font-size="34" font-weight="800" fill="#22312f">抢宝大作战</text>
  <text x="100" y="180" class="ui" font-size="15" fill="#68786f">3 × 3 · 同时暗选 · 最多 9 回合</text>

  <g>
    <rect x="100" y="198" width="150" height="50" rx="14" fill="#dff0e4" stroke="#22312f" stroke-width="2.5" />
    <text x="118" y="230" class="ui" font-size="18" font-weight="700" fill="#22312f">你</text>
    <text x="228" y="231" text-anchor="end" class="ui" font-size="24" font-weight="800" fill="#2f7d59">9</text>
