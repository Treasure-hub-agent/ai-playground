      <path d="M248 416 l28 28 m0 -28 l-28 28" fill="none" stroke="#8a978f" stroke-width="4" stroke-linecap="round" />
      <text x="262" y="466" text-anchor="middle" class="ui" font-size="11" fill="#8a978f">撞车</text>
