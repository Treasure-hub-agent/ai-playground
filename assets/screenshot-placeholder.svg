    <text x="554" y="530">状态 playing · 等待双方提交</text>
    <text x="1062" y="530" text-anchor="end">人类浏览器 × Agent MCP</text>
  </g>

  <!-- 占位标签 -->
  <g transform="rotate(-3 990 120)">
    <rect x="872" y="98" width="256" height="44" rx="10" fill="#d95f43" stroke="#22312f" stroke-width="2.5" />
    <text x="1000" y="127" text-anchor="middle" class="ui" font-size="18" font-weight="800" fill="#fffaf0">对局截图占位 · 发布前替换</text>
