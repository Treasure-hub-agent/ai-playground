      <circle cx="374" cy="308" r="28" fill="#e9b949" stroke="#22312f" stroke-width="2.5" />
      <circle cx="374" cy="308" r="20" fill="#f6d57e" stroke="#22312f" stroke-width="1.5" opacity="0.8" />
