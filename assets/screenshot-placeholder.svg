  <!-- 页脚 -->
  <text x="600" y="638" text-anchor="middle" class="ui" font-size="15" fill="#68786f">发布前把真实截图存为 assets/screenshot.png，并更新 README 图片路径 · 建议 1200 × 675</text>
  <path d="M770 648 q50 12 100 0" fill="none" stroke="#e9b949" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
