  <!-- 右侧：Agent 视角与气泡 -->
  <rect x="500" y="150" width="592" height="406" rx="20" fill="#fdf8ec" stroke="#22312f" stroke-width="3" />
  <text x="528" y="185" class="ui" font-size="16" font-weight="700" fill="#22312f">Agent 看到的 state（节选）</text>
  <rect x="528" y="201" width="536" height="158" rx="12" fill="#22312f" />
  <g class="mono" font-size="15" fill="#eaf2e8">
    <text x="548" y="229">第 4/9 回合 · 你 9 分 · 对手 12 分</text>
    <text x="548" y="257">第 0 行:  ✖ | 💣 | 💰1</text>
    <text x="548" y="285">第 1 行: 💰2 | ✖ | 💰3</text>
    <text x="548" y="313">第 2 行: 空 | 💰1 | 💰2</text>
    <text x="548" y="341" fill="#8fb6a0">legalActions: 6 个可选格</text>
  </g>

  <g>
    <rect x="528" y="382" width="300" height="46" rx="18" fill="#f7e3dc" stroke="#22312f" stroke-width="2" />
    <text x="548" y="411" class="ui" font-size="15" fill="#22312f">Agent：这枚 3 分归我了。</text>
